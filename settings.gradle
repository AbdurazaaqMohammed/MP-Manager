dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://api.xposed.info/'
            content { includeGroup 'de.robv.android.xposed' }
        }
    }
}
rootProject.name = "MP Manager"
include ':app'
include ':sdk'
include ':packs:pack-math'
include ':packs:pack-notes'
include ':packs:pack-text'
include ':packs:pack-random'
include ':packs:pack-device'
include ':packs:pack-media'
include ':packs:pack-network'
include ':packs:pack-ocr'
include ':samples:plugin-sample'
include ':apkkit'
include ':zero-symbol-input-view'
include ':patchers:lspatch-runtime'
if (providers.gradleProperty('patcherRegressionFixtures').orNull == 'true') {
    include ':patchers:fixture-target'
    include ':patchers:fixture-split'
    include ':patchers:fixture-legacy'
    include ':patchers:fixture-modern'
}
