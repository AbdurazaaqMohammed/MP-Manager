plugins {
    id 'com.android.application'
}

android {
    compileSdk 36
    namespace 'com.example.mpextsample'
    defaultConfig {
        applicationId "com.example.mpextsample"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Slim plugin SDK (contracts + runtime helpers). Bundled into the APK on
    // purpose: this sample proves the standalone plugin SDK packages cleanly.
    implementation project(':plugin-sdk')
}
