plugins {
    id 'com.android.application'
}

// Signing identity has to survive every rebuild, otherwise the app cannot be installed over
// its own previous version and CI artefacts are not comparable.
//
// The debug key is therefore the one committed at app/src/main/assets/debug.keystore rather
// than the ~/.android/debug.keystore AGP would otherwise generate fresh on each machine. It is
// the same key the app signs with at runtime (FileUtils.getDebugKeystore), so an APK this app
// signs itself installs straight over a CI build without an uninstall in between.
//
// Release keys never live in the repository. Point MPM_* at one, or drop a keystore.properties
// next to this file (see .gitignore), and assembleRelease signs with it; with neither present
// the release APK stays unsigned and the workflow's apksigner step handles it from a secret.
def releaseSigning = {
    def props = new Properties()
    def propsFile = rootProject.file("keystore.properties")
    if (propsFile.exists()) {
        propsFile.withInputStream { props.load(it) }
    }
    def store = System.getenv("MPM_STORE_FILE") ?: props.getProperty("storeFile")
    if (!store) return null
    [
            storeFile     : rootProject.file(store),
            storePassword : System.getenv("MPM_STORE_PASSWORD") ?: props.getProperty("storePassword"),
            keyAlias      : System.getenv("MPM_KEY_ALIAS") ?: props.getProperty("keyAlias"),
            keyPassword   : System.getenv("MPM_KEY_PASSWORD") ?: props.getProperty("keyPassword"),
    ]
}()

android {
    compileSdk 36
    lint {
        baseline = file("lint.xml")
    }
    defaultConfig {
        applicationId "io.github.abdurazaaqmohammed.MPManager"
        // 21 (not 19): smbj, okhttp 4.x and AWS SDK all require it, and the
        // remote-filesystem work needs those libraries.
        minSdk 21
        targetSdk 37
        multiDexEnabled true
        versionCode 10
        versionName "1.0.9"
    }

    signingConfigs {
        bundled {
            storeFile file("src/main/assets/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if (releaseSigning != null) {
            release {
                storeFile releaseSigning.storeFile
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.bundled
        }
        release {
            if (releaseSigning != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    namespace 'io.github.abdurazaaqmohammed.MPManager'

    buildFeatures {
        aidl true
        buildConfig true
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
    packaging {
        resources.excludes.add("META-INF/DEPENDENCIES")
        // bcprov and jsch both ship multi-release OSGi manifests, at different
        // Java versions, and only one may be packaged. Android reads none of
        // them, so exclude the whole family rather than one version at a time.
        resources.excludes.add("META-INF/versions/*/OSGI-INF/MANIFEST.MF")
        resources.excludes.add("META-INF/versions/*/OSGI-INF/LICENSES/**")
    }
}

dependencies {
    implementation project(':sdk')
    //implementation files('libs/APKEditor-1.4.8.jar')
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    implementation("androidx.multidex:multidex:2.0.1")
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'androidx.startup:startup-runtime:1.1.0'
    implementation 'androidx.media:media:1.7.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    //implementation files('libs/animato.jar')
    implementation files('libs/antlr.jar')
    implementation 'androidx.recyclerview:recyclerview:1.4.0-alpha01'
    implementation files('libs/JCommand.jar')
    implementation files('libs/bin-zip.jar')
    implementation files('libs/arsc-parser.jar')
    // 1.27.1 replaces the bundled 1.21 jar: it carries years of 7z reader
    // fixes, adds writing encrypted 7z (SevenZOutputFile(File, char[]), 1.23+)
    // and per-method options (setContentMethods, dict size for LZMA2).
    // commons-io was already a dependency; 1.26+ also needs commons-codec.
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'commons-codec:commons-codec:1.17.1'
    implementation files('libs/xz-1.9.jar')
    implementation files('libs/junrar-7.5.5.jar')
    implementation("com.google.android.material:material:1.12.0")
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation("com.google.guava:guava:33.6.0-android")
    implementation 'com.beust:jcommander:1.82'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    //implementation 'com.github.AtifSayings:Animatoo:1.0.1'
    //implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'io.github.skylot:jadx-core:1.4.7'
    implementation 'io.github.skylot:jadx-plugins-api:1.4.7'
    implementation 'io.github.skylot:jadx-dex-input:1.4.7'
    implementation 'org.slf4j:slf4j-android:1.7.36'
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.collection:collection:1.6.0"
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.jruby.joni:joni:2.2.7'
    implementation files('libs/language-java-debug.aar')//'io.github.Rosemoe.sora-editor:language-java:0.23.6'
    implementation files('libs/editor-debug.aar')
    implementation files('libs/language-textmate-debug.aar')
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    implementation 'io.github.java-diff-utils:java-diff-utils:4.17'
    implementation(platform("io.github.Rosemoe.sora-editor:bom:0.23.6"))
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.window:window:1.5.1"

    implementation files('libs/commons-net-3.11.1.jar')
    implementation("dev.rikka.shizuku:api:13.1.5")
    implementation("dev.rikka.shizuku:provider:13.1.5")
    implementation("org.apache.ftpserver:ftplet-api:1.2.1")
    implementation("org.apache.ftpserver:ftpserver-core:1.2.1")
    implementation("commons-io:commons-io:2.22.0")
    implementation("org.bouncycastle:bcprov-jdk18on:1.84")
    // OpenPGP (password-based encryption). The app has no gpg binary, so
    // encryption is done in-process; output is standard OpenPGP that gpg
    // itself can read. bcprov/bcpg/bcutil must be the same version or they
    // ship overlapping org.bouncycastle.asn1 classes and the build fails the
    // duplicate-class check; pinned to 1.84, the trio is verified to round-trip
    // with gpg in both directions.
    implementation("org.bouncycastle:bcpg-jdk18on:1.84")
    implementation("org.bouncycastle:bcutil-jdk18on:1.84")
    implementation("com.google.zxing:core:3.5.3")
    implementation("com.journeyapps:zxing-android-embedded:4.3.0")
    implementation("dev.rikka.shizuku:api:13.1.5")
    implementation("dev.rikka.shizuku:provider:13.1.5")

    // Remote filesystems. okhttp backs the WebDAV client, the AWS SigV4 signer
    // is hand-written, jsch speaks SFTP and smbj speaks SMB/CIFS.
    // smbj's BouncyCastle and slf4j requirements are already met above, so it
    // only adds about a megabyte.
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("com.github.mwiede:jsch:0.2.23")
    // SMB (smbj) is intentionally absent: it pulls its own transitive tree and
    // there is no way to exercise it from a phone, so it lands with the
    // implementation that has actually been tested.

    testImplementation 'junit:junit:4.13.2'
}