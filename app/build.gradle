plugins {
    id 'com.android.application'
}

android {
    compileSdk 37

    defaultConfig {
        applicationId "io.github.abdurazaaqmohammed.MPManager"
        minSdk 19
        targetSdk 37
        multiDexEnabled true
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
    namespace 'io.github.abdurazaaqmohammed.MPManager'

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
    packaging {
        resources.excludes.add("META-INF/DEPENDENCIES")
    }
}

dependencies {
   implementation("androidx.multidex:multidex:2.0.1")
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'androidx.startup:startup-runtime:1.1.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    //implementation files('libs/animato.jar')
    implementation files('libs/antlr.jar')
    implementation 'androidx.recyclerview:recyclerview:1.4.0-alpha01'
    implementation files('libs/JCommand.jar')
    implementation files('libs/bin-zip.jar')
    implementation files('libs/arsc-parser.jar')
    implementation("com.google.android.material:material:1.12.0")
    implementation("com.google.guava:guava:33.6.0-android")
    implementation 'com.beust:jcommander:1.82'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    //implementation 'com.github.AtifSayings:Animatoo:1.0.1'
    //implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'io.github.skylot:jadx-core:1.4.7'
    implementation 'io.github.skylot:jadx-plugins-api:1.4.7'
    implementation 'io.github.skylot:jadx-dex-input:1.4.7'
    implementation 'org.slf4j:slf4j-android:1.7.36'
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.collection:collection:1.6.0"
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.jruby.joni:joni:2.2.7'
