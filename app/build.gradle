plugins {
    id 'com.android.application'
}

android {
    compileSdk 37

    defaultConfig {
        applicationId "io.github.abdurazaaqmohammed.MPManager"
        minSdk 19
        targetSdk 37
        multiDexEnabled true
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
    namespace 'io.github.abdurazaaqmohammed.MPManager'

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
    packaging {
        resources.excludes.add("META-INF/DEPENDENCIES")
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
   implementation("androidx.multidex:multidex:2.0.1")
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'androidx.startup:startup-runtime:1.1.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('libs/JCommand.jar')
    implementation files('libs/bin-zip.jar')
    implementation files('libs/arsc-parser.jar')
    implementation("com.google.android.material:material:1.12.0")
    implementation("com.google.guava:guava:33.6.0-android")
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.collection:collection:1.6.0"
    implementation files('libs/commons-io.jar')
    implementation files('libs/editor-debug.aar')
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    implementation 'io.github.java-diff-utils:java-diff-utils:4.17'
    implementation(platform("io.github.Rosemoe.sora-editor:bom:0.23.6"))
    implementation("androidx.collection:collection:1.6.0-rc01")
    implementation 'androidx.preference:preference:1.2.1'

    implementation files('libs/ftp4j-1.7.2.jar')
    implementation("org.apache.ftpserver:ftplet-api:1.2.1")
    implementation("org.apache.ftpserver:ftpserver-core:1.2.1")
    implementation("org.bouncycastle:bcprov-jdk18on:1.84")
}