name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

jobs:
  build:
    name: Assemble
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # android-actions/setup-android@v3 is deliberately not used: it runs
      # `sdkmanager tools`, and Google removed the legacy "tools" package, so the
      # action dies with "Failed to find package 'tools'" before any job step of
      # ours runs. The ubuntu-latest image already ships the SDK and cmdline-tools.
      - name: Install SDK components
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found on this runner"; exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # app/build.gradle declares no signingConfig, so `assembleRelease` only
      # yields app-release-unsigned.apk. Sign it here (zipalign first, then
      # apksigner) so release artifacts are actually installable.
      - name: Restore signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No KEYSTORE_BASE64 secret; release APK will stay unsigned." >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 --decode > keystore/release.jks
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          # gradlew is tracked as 100644 upstream, so a fresh checkout has no
          # execute bit.
          chmod +x gradlew
          # Tool packs have been removed from the project.
          TASKS=":app:assembleRelease :app:assembleDebug"
          echo "Gradle tasks: $TASKS"
          # shellcheck disable=SC2086
          ./gradlew --stacktrace $TASKS

      - name: Collect, align and sign
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          HAS_KEYSTORE: ${{ steps.keystore.outputs.available }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(ls -d "$SDK_ROOT"/build-tools/*/ 2>/dev/null | grep -E '/3[0-9]+\.[0-9]+\.[0-9]+/$' | sort -V | tail -1)"
          if [ -z "$BUILD_TOOLS" ]; then
            echo "::error::no build-tools with apksigner found under $SDK_ROOT/build-tools"
            exit 1
          fi
          BUILD_TOOLS="${BUILD_TOOLS%/}"
          echo "build-tools: $BUILD_TOOLS"
          TAG="${REF_NAME//\//-}"
          STAGE=out-apk
          rm -rf "$STAGE" && mkdir -p "$STAGE"

          cp app/build/outputs/apk/debug/app-debug.apk "$STAGE/MP-Manager-debug.apk"

          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ ! -f "$UNSIGNED" ]; then
            echo "::error::release APK was not produced"; exit 1
          fi
          cp "$UNSIGNED" "$STAGE/MP-Manager-$TAG-unsigned.apk"

          : > verify.txt
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ALIGNED="$STAGE/MP-Manager-$TAG-aligned.apk"
            SIGNED="$STAGE/MP-Manager-$TAG.apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" sign \
              --ks keystore/release.jks \
              --ks-key-alias "${KEY_ALIAS:-CERT}" \
              --ks-pass "pass:${STORE_PASS}" \
              --key-pass "pass:${KEY_PASS:-$STORE_PASS}" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$SIGNED" \
              "$ALIGNED"
            "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED" | tee verify.txt
            rm -f "$ALIGNED"
          else
            echo "release APK left unsigned (no KEYSTORE_BASE64 secret)." > verify.txt
          fi

          echo "### Build output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la "$STAGE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MP-Manager-apk
          path: |
            out-apk/
            verify.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out-apk/*.apk
          body_path: verify.txt
          fail_on_unmatched_files: true
