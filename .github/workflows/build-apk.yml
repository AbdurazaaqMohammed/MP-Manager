name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_packs:
        description: 'Also build the tool pack APKs'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

jobs:
  build:
    name: Assemble
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      # app/build.gradle declares no signingConfig, so `assembleRelease` only
      # yields app-release-unsigned.apk. Sign it here (zipalign first, then
      # apksigner) so release artifacts are actually installable.
      - name: Restore signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No KEYSTORE_BASE64 secret; release APK will stay unsigned." >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 --decode > keystore/release.jks
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          BUILD_PACKS: ${{ inputs.build_packs }}
        run: |
          set -o pipefail
          TASKS=":app:assembleRelease :app:assembleDebug"
          if [ "$BUILD_PACKS" = "true" ]; then
            for p in math text time random device media network; do
              TASKS="$TASKS :packs:pack-$p:assembleRelease"
            done
          fi
          echo "Gradle tasks: $TASKS"
          # shellcheck disable=SC2086
          ./gradlew --stacktrace $TASKS

      - name: Collect, align and sign
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          HAS_KEYSTORE: ${{ steps.keystore.outputs.available }}
          BUILD_PACKS: ${{ inputs.build_packs }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          TAG="${REF_NAME//\//-}"
          STAGE=out-apk
          rm -rf "$STAGE" && mkdir -p "$STAGE"

          cp app/build/outputs/apk/debug/app-debug.apk "$STAGE/MP-Manager-debug.apk"

          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ ! -f "$UNSIGNED" ]; then
            echo "::error::release APK was not produced"; exit 1
          fi
          cp "$UNSIGNED" "$STAGE/MP-Manager-$TAG-unsigned.apk"

          : > verify.txt
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ALIGNED="$STAGE/MP-Manager-$TAG-aligned.apk"
            SIGNED="$STAGE/MP-Manager-$TAG.apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" sign \
              --ks keystore/release.jks \
              --ks-key-alias "${KEY_ALIAS:-CERT}" \
              --ks-pass "pass:${STORE_PASS}" \
              --key-pass "pass:${KEY_PASS:-$STORE_PASS}" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$SIGNED" \
              "$ALIGNED"
            "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED" | tee verify.txt
            rm -f "$ALIGNED"
          else
            echo "release APK left unsigned (no KEYSTORE_BASE64 secret)." > verify.txt
          fi

          if [ "$BUILD_PACKS" = "true" ]; then
            for p in math text time random device media network; do
              f="packs/pack-$p/build/outputs/apk/release/pack-$p-release-unsigned.apk"
              { [ -f "$f" ] && cp "$f" "$STAGE/pack-$p.apk"; } || true
            done
          fi

          echo "### Build output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la "$STAGE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MP-Manager-apk
          path: |
            out-apk/
            verify.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out-apk/*.apk
          body_path: verify.txt
          fail_on_unmatched_files: true
          fail_on_unmatched_files: true
