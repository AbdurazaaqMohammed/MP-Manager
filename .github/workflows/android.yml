# Build MP-Manager APK
# Note: Offline project rules reside locally at /storage/emulated/0/Download/apks/Pref/Antigravity/project_rules.md
# (These offline/CI configuration notes are strictly local to our test repo and must be excluded from any future upstream PR).
# Always review project rules before any build unless already reviewed in the current session.
# Rule 3 & 5: Builds are triggered strictly and exclusively on branch main with the commit message phrase 'action do build'.

name: Build MP-Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - split-archives-flutter

jobs:
  build:
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'action do build')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Patch incompatible Material attribute
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "android.R.attr.colorPrimaryContainer"
          new = "com.google.android.material.R.attr.colorPrimary"

          count = 0
          for path in Path(".").rglob("*.java"):
              source = path.read_text()
              updated = source.replace(old, new)
              if updated != source:
                  path.write_text(updated)
                  count += source.count(old)
                  print(f"Patched: {path}")

          print(f"Total replacements: {count}")
          PY

      - name: Build APK
        run: ./gradlew assembleFullRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MP-Manager-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
