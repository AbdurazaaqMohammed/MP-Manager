# Build otomatis tiap ada push ke main atau feat/*, atau PR ke main.
# Bisa juga dijalanin manual dari tab Actions kalau lagi males nunggu trigger.
# Hasilnya cuma artifact, bukan Release — buat testing doang.

name: Build APK

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Ambil kode dari repo. fetch-depth 0 biar tag-nya keikut kalau butuh.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Project ini butuh JDK 17, jadi pasang dulu.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # NDK suka gagal download di runner, jadi kita coba sampai 3x.
      # Kalau masih gagal juga, ya udah biarin aja — build-nya mungkin tetap jalan tanpa NDK.
      - name: Install NDK
        run: |
          yes | sdkmanager --licenses || true
          for i in 1 2 3; do
            if sdkmanager --install "ndk;26.1.10909125"; then
              echo "NDK installed on attempt $i"
              break
            fi
            echo "Attempt $i failed, retrying"
            sleep 15
            rm -rf /usr/local/lib/android/sdk/ndk/26.1.10909125
          done
          sdkmanager --list_installed | grep ndk || echo "NDK check failed"

      # Gradlew kadang ilang permission-nya pas di-checkout, kasih +x aja.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build APK release. Sengaja pakai continue-on-error biar kalau
      # ada error, workflow tetap lanjut ke step upload.
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      # Upload APK-nya biar bisa di-download dari tab Actions.
      # Kalau APK-nya nggak ada, cuma warning — workflow nggak dianggap gagal.
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MP-Manager-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
