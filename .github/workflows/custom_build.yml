# Custom Build Workflow for Antigravity & User Testing
# Note: This workflow is strictly local to our testing repository and will not be included in upstream PRs.
# Standard build: assembleFullDebug (fast, uncompressed, zero Proguard/R8 shrinking headaches).
# Builds are triggered only when commit message contains 'action do build' or via manual dispatch.

name: Antigravity Build MP-Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'action do build')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Patch incompatible Material attribute
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "android.R.attr.colorPrimaryContainer"
          new = "com.google.android.material.R.attr.colorPrimary"

          count = 0
          for path in Path(".").rglob("*.java"):
              source = path.read_text()
              updated = source.replace(old, new)
              if updated != source:
                  path.write_text(updated)
                  count += source.count(old)
                  print(f"Patched: {path}")

          print(f"Total replacements: {count}")
          PY

      - name: Build APK
        run: ./gradlew assembleFullDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MP-Manager-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
